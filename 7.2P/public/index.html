<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realtime Notification App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 650px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #2f5bea;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 8px;
      background: #2f5bea;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #2448bd;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #eef3ff;
      margin-bottom: 10px;
      padding: 12px 15px;
      border-left: 5px solid #2f5bea;
      border-radius: 8px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Realtime Notification App</h1>
    <p class="subtitle">Send a notification and see it update in real time.</p>

    <div class="input-area">
      <input id="messageInput" type="text" placeholder="Enter notification message">
      <button id="sendBtn">Send</button>
    </div>

    <h2>Notifications</h2>
    <ul id="notificationList"></ul>

    <p class="footer">Powered by Express and Socket.IO</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
